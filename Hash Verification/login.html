<!DOCTYPE html>
<html>
<head>
    <title>Hash Verification Login</title>

    <style>
        body {
            margin: 0;
            font-family: "Times New Roman", serif;
            background: #d1e6ed;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-wave {
            background: white;
            height: 230px;
            width: 100%;
            clip-path: ellipse(80% 60% at 50% 0%);
        }

        .login-box {
            width: 420px;
            background: #e5e5e5;
            margin-top: -100px;
            padding: 40px 35px;
            border-radius: 14px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.18);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            font-size: 30px;
            font-weight: bold;
            color: #333;
            margin-bottom: 25px;
            font-family: "Times New Roman", serif;
        }

        label {
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            color: #444;
            margin-bottom: 6px;
            font-family: "Times New Roman", serif;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 30px;
            border: 1px solid #ccc;
            font-size: 16px;
            background: white;
            margin-bottom: 20px;
            outline: none;

            /* 🔥 FIX: Input text font */
            font-family: "Times New Roman", serif;
        }

        input::placeholder {
            color: #666;

            /* 🔥 FIX: Placeholder font */
            font-family: "Times New Roman", serif;
        }

        input:focus {
            border-color: #f05432;
            box-shadow: 0 0 0 3px rgba(240,84,50,0.2);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            background: #f05432;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.25s;
            text-align: center;
            font-family: "Times New Roman", serif;
        }

        .login-btn:hover {
            background: #d94626;
        }

        .error {
            text-align: center;
            color: red;
            font-size: 16px;
            margin-bottom: 10px;
            display: none;
            font-family: "Times New Roman", serif;
        }
    </style>
</head>

<body>

<div class="header-wave"></div>

<div class="login-box">

    <h2>Hash Verification</h2>

    <p id="error-msg" class="error">Invalid username or password</p>

    <label>Username *</label>
    <input id="username" placeholder="Enter your Username">

    <label>Password *</label>
    <input type="password" id="password" placeholder="Enter your Password">

    <button class="login-btn" onclick="login()">LOGIN</button>
</div>

<script>
async function login() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const error = document.getElementById("error-msg");

    const res = await fetch("https://index-umwn.onrender.com/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (data.success) {
        error.style.display = "none";
        window.location.href = "hashverify.html";  
    } else {
        error.style.display = "block";
        error.innerText = data.message;
    }
}
</script>

</body>
</html>
